openapi: 3.0.3
info:
  title: API de Gerenciamento de Posts
  description: API para gerenciamento de posts e usuários.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Servidor Local
  - url: https://tech-challenge-fase-2-1uhu.onrender.com/api
    description: Servidor em Produção (Render)

tags:
  - name: Posts
  - name: Comentários
  - name: Usuários
  - name: Autenticação

paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Listar todos os posts
      description: Retorna a lista de posts. Para alunos, informa se o post já foi visualizado. Para professores e administradores, informa os alunos que visualizaram o post.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de posts retornada com sucesso.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/PostAluno'
                  - type: array
                    items:
                      $ref: '#/components/schemas/PostProfessor'
              examples:
                aluno:
                  $ref: '#/components/examples/ListaPostsAluno'
                professor:
                  $ref: '#/components/examples/ListaPostsProfessor'

        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Posts
      summary: Criar um novo post
      description: Permite que professores e administradores autenticados criem novas postagens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - titulo
                - descricao
                - conteudo
                - subjectName
              properties:
                titulo:
                  type: string
                  example: Introdução à Programação
                descricao:
                  type: string
                  example: Conceitos básicos de programação.
                conteudo:
                  type: string
                  example: Lorem Ipsum dolor sit amet...
                image:
                  type: string
                  format: binary
                subjectName:
                  type: string
                  enum:
                    - Geral
                    - Português
                    - Matemática
                    - Geografia
                    - História
                    - Ciências
                    - Ensino Religioso
                  example: Matemática
      responses:
        '201':
          description: Post criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 'Post criado com sucesso!'
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 'Dados inválidos'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '403':
          $ref: '#/components/responses/ForbiddenError'

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Obter um post pelo ID
      description: Retorna o conteúdo completo de um post específico. Quando acessado por um aluno, registra automaticamente a visualização do post.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do post
      responses:
        '200':
          description: Post encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBase'
              example:
                postId: 33d5256f-5199-4a3d-b06d-e3d7cd0f64f0
                titulo: Aula inicial
                descricao: Primeira aula de ciências do curso
                conteudo: Lorem Ipsum dolor sit amet...
                image: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
                subject:
                  id: 78e6d80d-b03a-48a6-881d-a695979e8a69
                  nome: Ciências
                dataCriacao: '2026-01-29T10:00:00.000Z'
                dataModificacao: '2026-05-04T10:00:00.000Z'
        '404':
          description: Post não encontrado.
          content:
            application/json:
              example:
                message: Post não encontrado

    put:
      tags:
        - Posts
      summary: Atualizar um post
      description: Permite que administradores atualizem qualquer post e professores atualizem apenas os posts que criaram.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  example: Novo título
                descricao:
                  type: string
                  example: Nova descrição
                conteudo:
                  type: string
                  example: Conteúdo atualizado da postagem.
                image:
                  type: string
                  format: binary
                subjectName:
                  type: string
                  enum:
                    - Geral
                    - Português
                    - Matemática
                    - Geografia
                    - História
                    - Ciências
                    - Ensino Religioso
                  example: Matemática
      responses:
        '200':
          description: Post atualizado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Post atualizado com sucesso!
        '404':
          description: Post não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Post não encontrado
        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '403':
          $ref: '#/components/responses/ForbiddenError'

    delete:
      tags:
        - Posts
      summary: Excluir um post
      description: Permite que administradores excluam qualquer post e professores excluam apenas os posts que criaram.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do post
      responses:
        '200':
          description: Post removido com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Post removido com sucesso
        '404':
          description: Post não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Post não encontrado
        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '403':
          $ref: '#/components/responses/ForbiddenError'

  /posts/search:
    get:
      tags:
        - Posts
      summary: Buscar posts
      description: Busca posts por palavras-chave presentes no título, descrição ou conteúdo, sem diferenciar letras maiúsculas e minúsculas.
      security:
        - bearerAuth: []
      parameters:
        - name: termo
          in: query
          required: true
          schema:
            type: string
          example: matemática
      responses:
        '200':
          description: Lista de posts encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
              example:
                - postId: 33d5256f-5199-4a3d-b06d-e3d7cd0f64f0
                  titulo: Aula inicial
                  descricao: Primeira aula de matemática do curso
                  conteudo: Lorem Ipsum dolor sit amet...
                  image: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
                  subject:
                    id: 78e6d80d-b03a-48a6-881d-a695979e8a69
                    nome: Matemática
                  dataCriacao: '2026-01-29T10:00:00.000Z'
                  dataModificacao: '2026-05-04T10:00:00.000Z'
                  criadoPor:
                    userId: cea50a97-f63e-4cd6-8a2c-e2a02f93c6e4

                - postId: 44d5256f-5199-4a3d-b06d-e3d7cd0f64f1
                  titulo: Aula de Matemática
                  descricao: Aula de função do 2º grau
                  conteudo: Lorem Ipsum dolor sit amet...
                  image: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
                  subject:
                    id: 44d5256f-5199-4a3d-b06d-e3d7cd0f64f1
                    nome: Matemática
                  dataCriacao: '2026-03-10T10:00:00.000Z'
                  dataModificacao: '2026-05-04T10:00:00.000Z'
                  criadoPor:
                    userId: 9d92fefb-4610-4b41-ab7c-1841cd0275f5

        '400':
          description: Termo de busca inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Termo de busca inválido
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /posts/{id}/image:
    get:
      tags:
        - Posts
      summary: Obtém imagem anexada do post
      description: Esta rota facilita a obtenção da imagem pelo front-end, que precisa receber a imagem por uma URL para renderizá-la.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do post
      responses:
        '200':
          description: Imagem retornada com sucesso.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Imagem não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Imagem não encontrada
        '415':
          description: Tipo de imagem não identificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Tipo de imagem não identificado
        '500':
          description: Erro ao obter a imagem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Erro ao obter a imagem

  /post/comment/{postId}:
    post:
      tags:
        - Comentários
      summary: Cria um novo comentário num post
      description: Retorna uma mensagem indicando sucesso. O parâmetro da rota representa o ID do post.
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conteudo
              properties:
                parentCommentId:
                  type: string
                  format: uuid
                  example: ae853bf8-9297-4ec2-b13d-3ddbbf332f4f
                conteudo:
                  type: string
                  example: Lorem Ipsum dolor sit amet...
      responses:
        '201':
          description: Comentário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comentário criado com sucesso!
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                noUserId:
                  summary: Usuário obrigatório
                  value:
                    message: Usuário é obrigatório
                noPostId:
                  summary: Post obrigatório
                  value:
                    message: Post é obrigatório.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Somente o autor do post pode responder a comentários do post
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Somente o autor do post pode responder a comentários do post
        '404':
          description: Usuário ou post não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                userNotFound:
                  summary: Usuário não encontrado
                  value:
                    message: Usuário não encontrado
                postNotFound:
                  summary: Post não encontrado
                  value:
                    message: Post não encontrado

  /post/comment/{commentId}:
    get:
      tags:
        - Comentários
      summary: Obtém um comentário pelo ID
      description: Esta rota obtém todos os dados de um post fornecendo apenas seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do comentário
      responses:
        '200':
          description: Lista de posts encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commment'
              example:
                commentId: 428e7264-b4fa-46c6-a595-568e27b947d5
                postId: ffc3d557-17c0-474e-a2f5-5fa816f2d854
                userId: 7a00b76b-6528-4f49-a3d7-f95648008a62
                conteudo: Conteúdo do Post... Lorem Ipsum dolor sit amet
                dataCriacao: 2026-08-18T21:57:04.433Z
                dataModificacao: 2026-08-18T21:57:04.433Z

        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '404':
          description: Comentário não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comentário não encontrado

    patch:
      tags:
        - Comentários
      summary: Atualiza os dados do comentário
      description: Esta rota atualiza o conteúdo de um comentário
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do comentário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conteudo
              properties:
                conteudo:
                  type: string
                  example: Novo conteúdo para o comentário
      responses:
        '200':
          description: Atualização feita com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comentário atualizado com sucesso!

        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '403':
          description: Impede outros usuários de editar os comentários. Apenas o autor do comentário ou um Admin podem editar comentários
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Somente o autor do comentário pode editar seus próprios comentários

        '404':
          description: Comentário não encontrado
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Autor do comentário não encontrado
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Comentário não encontrado

    delete:
      tags:
        - Comentários
      summary: Deletar um comentário de um post pelo ID
      description: Deleta um comentário. Apenas o autor do comentário, ou o autor do post ou um Admin podem deletar um comentário
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do comentário a ser deletado
      responses:
        '200':
          description: Comentário removido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Comentário removido com sucesso

        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

        '404':
          description: Comentário ou Post vinculado não encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                commentNotFound:
                  summary: Comentário não encontrado
                  value:
                    message: Comentário não encontrado
                postNotFound:
                  summary: Post não encontrado
                  value:
                    message: Post não encontrado

  /post/comment/list/{postId}:
    get:
      tags:
        - Comentários
      summary: Obtém lista com todos os dados dos comentários vinculados a um post
      description: Esta rota obtém todos os dados dos comentários de um post fornecendo apenas seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
          description: ID do post
      responses:
        '200':
          description: Lista de comentários encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commment'
              example:
                - id: 428e7264-b4fa-46c6-a595-568e27b947d5
                  user: Francisco
                  conteudo: Conteúdo do Post... Lorem Ipsum dolor sit amet
                  dataCriacao: 2026-08-18T21:57:04.433Z
                  dataModificacao: 2026-08-18T21:57:04.433Z

                - id: 428e7264-b4fa-46c6-a595-568e27b947d5
                  childComment:
                    id: 2bd0fd4f-48a8-4142-9235-3fe969a40074
                    conteudo: Resposta do professor
                    dataCriacao: 2026-08-18T21:57:04.433Z
                    dataModificacao: 2026-08-18T21:57:04.433Z
                  user: Francisco
                  conteudo: Conteúdo do Post... Lorem Ipsum dolor sit amet
                  dataCriacao: 2026-08-18T21:57:04.433Z
                  dataModificacao: 2026-08-18T21:57:04.433Z

                - id: 428e7264-b4fa-46c6-a595-568e27b947d5
                  user: Francisco
                  conteudo: Conteúdo do Post... Lorem Ipsum dolor sit amet
                  dataCriacao: 2026-08-18T21:57:04.433Z
                  dataModificacao: 2026-08-18T21:57:04.433Z

        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '404':
          description: Post não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Post não encontrado

  /user:
    get:
      tags:
        - Usuários
      summary: Listar usuários
      description: Lista usuários cadastrados. Administradores visualizam todos os usuários; professores visualizam apenas alunos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuários retornados com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
              example:
                - id: ae853bf8-9297-4ec2-b13d-3ddbbf332f4f
                  matricula: '303030'
                  nome: João Silva
                  birthDate: '2010-08-15'
                  image: /api/user/916f9d1e-dd31-46ef-b019-db09dcfa50ea/image
                  role: ALUNO
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags:
        - Usuários
      summary: Criar usuário
      description: Cria um novo usuário no sistema.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - matricula
                - senha
                - nome
              properties:
                role:
                  type: string
                  enum:
                    - ALUNO
                    - PROFESSOR
                    - ADMIN
                  example: ALUNO
                matricula:
                  type: string
                  example: 303030
                senha:
                  type: string
                  example: senha123
                nome:
                  type: string
                  example: João Silva
                birthDate:
                  type: string
                  format: date
                  description: Data de nascimento do usuário no formato aaaa-mm-dd.
                  example: '2010-08-15'
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Usuário criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: ae853bf8-9297-4ec2-b13d-3ddbbf332f4f
                  matricula:
                    type: string
                    example: '303030'
                  nome:
                    type: string
                    example: João Silva
                  birthDate:
                    type: string
                    format: date
                    nullable: true
                    description: Data de nascimento do usuário no formato aaaa-mm-dd.
                    example: '2010-08-15'
                  image:
                    type: string
                    nullable: true
                    description: endpoint da URL da imagem de perfil.
                    example: /api/user/ae853bf8-9297-4ec2-b13d-3ddbbf332f4f/image
                  role:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 78e6d80d-b03a-48a6-881d-a695979e8a69
                      nome:
                        type: string
                        example: ALUNO

        '400':
          $ref: '#/components/responses/CreateUserError'

        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '403':
          description: O usuário autenticado não possui permissão para acessar este recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AlunoCannotCreateUser:
                  summary: Aluno tenta criar novo usuário
                  value:
                    message: Acesso não autorizado.

                ProfessorCanOnlyCreateAluno:
                  summary: Professor tenta criar novo usuário que não é aluno
                  value:
                    message: Professores só possuem permissão para cadastrar alunos.

        '500':
          description: Role padrão ALUNO não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Role padrão ALUNO não encontrada

  /user/{id}:
    get:
      tags:
        - Usuários
      summary: Obter usuário pelo ID
      description: Retorna os dados de um usuário específico. Administradores podem consultar qualquer usuário; professores podem consultar apenas alunos.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do usuário
      responses:
        '200':
          description: Usuário retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: ae853bf8-9297-4ec2-b13d-3ddbbf332f4f
                matricula: '303030'
                nome: João Silva
                image: /api/user/ae853bf8-9297-4ec2-b13d-3ddbbf332f4f/image
                role: ALUNO
        '400':
          description: ID de usuário inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: ID de usuário inválido
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Professor tenta consultar um usuário que não é aluno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Professor não pode acessar dados de outros professores ou administradores!
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Usuário não encontrado

    patch:
      tags:
        - Usuários
      summary: Atualizar os dados de um usuário
      description: Permite que apenas administradores e professores atualizem os dados dos usuários.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do usuário
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - ALUNO
                    - PROFESSOR
                    - ADMIN
                  example: ALUNO
                nome:
                  type: string
                  example: Novo nome
                birthDate:
                  type: string
                  format: date
                  description: Data de nascimento do usuário no formato aaaa-mm-dd.
                  example: '2010-08-15'
                senha:
                  type: string
                  example: Nova senha
                image:
                  type: string
                  format: binary

      responses:
        '200':
          description: Informações de cadastro atualizadas com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: ae853bf8-9297-4ec2-b13d-3ddbbf332f4f
                  matricula:
                    type: string
                    example: '303030'
                  nome:
                    type: string
                    example: João Silva
                  birthDate:
                    type: string
                    format: date
                    nullable: true
                    description: Data de nascimento do usuário no formato aaaa-mm-dd.
                    example: '2010-08-15'
                  image:
                    type: string
                    nullable: true
                    description: endpoint da URL da imagem de perfil.
                    example: /api/user/ae853bf8-9297-4ec2-b13d-3ddbbf332f4f/image
                  role:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 78e6d80d-b03a-48a6-881d-a695979e8a69
                      nome:
                        type: string
                        example: ALUNO

        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '403':
          description: Se um professor tentar alterar o dado de um usuário que não é aluno, ele será impedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Professor não pode alterar dados de outros professores ou administradores!

        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Usuário não encontrado

    delete:
      tags:
        - Usuários
      summary: Deletar usuário
      description: Deleta um usuário do sistema. Apenas administradores podem deletar usuários. Quando o usuário excluído for criador de posts, seus posts também são excluídos. As visualizações vinculadas a esses posts são excluídas em cascata.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador único do usuário a ser deletado
      responses:
        '200':
          description: Usuário deletado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Usuário deletado com sucesso
        '400':
          description: ID de usuário inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: ID de usuário inválido
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Usuário não encontrado
  /user/me:
    get:
      tags:
        - Usuários
      summary: Obter dados do usuário Logado
      description: Essa rota obtém todos os dados do usuário logado que estão na tabela Users e também a Role dele
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário logado obtidos com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  matricula:
                    type: string
                  nome:
                    type: string
                  birthDate:
                    type: string
                    format: date
                    nullable: true
                  role:
                    type: string
              example:
                id: c2b58a4e-c4cf-4e20-978c-c1f2793ee18c
                matricula: '101010'
                nome: Francisco
                birthDate: '2010-08-15'
                role: ADMIN

        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /user/{id}/image:
    get:
      tags:
        - Usuários
      summary: Obtém a imagem de perfil do usuário
      description: Esta rota facilita a obtenção da imagem pelo front-end, que precisa receber a imagem por uma URL para renderizá-la.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do post
      responses:
        '200':
          description: Imagem retornada com sucesso.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Imagem não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Imagem não encontrada
        '415':
          description: Tipo de imagem não identificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Tipo de imagem não identificado
        '500':
          description: Erro ao obter a imagem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Erro ao obter a imagem

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Realizar login
      description: Autentica um usuário utilizando matrícula e senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - matricula
                - senha
              properties:
                matricula:
                  type: string
                  example: 303030
                senha:
                  type: string
                  example: senha123
      responses:
        '200':
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  usuario:
                    type: object
                    properties:
                      id:
                        type: string
                      nome:
                        type: string
                      matricula:
                        type: string
                      birthDate:
                        type: string
                        format: date
                        nullable: true
                      role:
                        type: string
                      image:
                        type: string
                        nullable: true
                        description: Endpoint da URL da foto de perfil do usuário.
              example:
                message: Login realizado com sucesso!
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjMmI1OGE0ZS1jNGNmLTRlMjAtOTc4Yy1jMWYyNzkzZWUxOGMiLCJyb2xlIjoiQURNSU4iLCJpYXQiOjE3ODI2OTYyNzUsImV4cCI6MTc4Mjc4MjY3NX0.GlTIaBuM4hpLlgBSoPduxG2A_SvEE7Xnzf4szdjw_ZE
                usuario:
                  id: c2b58a4e-c4cf-4e20-978c-c1f2793ee18c
                  nome: Francisco
                  matricula: '101010'
                  birthDate: '2010-08-15'
                  role: ALUNO
                  image: /api/user/90b6d80d-b03a-48a6-881d-a695979e8a70/image
        '401':
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Matrícula ou senha inválidas

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PostBase:
      type: object
      properties:
        postId:
          type: string
          example: 86c0ca58-c3f6-4fe7-8e0b-12df89530ac7
        titulo:
          type: string
          example: Aula 1 - TypeScript
        descricao:
          type: string
          example: Introdução ao TypeScript
        conteudo:
          type: string
          example: Conteúdo da aula...
        image:
          type: string
          nullable: true
          description: Endpoint da URL da imagem do post
          example: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
        subject:
          $ref: '#/components/schemas/Subject'
        dataCriacao:
          type: string
          format: date-time
          example: '2026-07-06T10:00:00.000Z'
        dataModificacao:
          type: string
          format: date-time
          example: '2026-07-06T10:00:00.000Z'
        criadoPor:
          type: object
          properties:
            userId:
              type: string
              format: uuid
              example: cea50a97-f63e-4cd6-8a2c-e2a02f93c6e4
            nome:
              type: string
              example: Ana Carolina
            tipoUsuario:
              type: string
              example: PROFESSOR

    Subject:
      type: object
      properties:
        id:
          type: string
          example: 78e6d80d-b03a-48a6-881d-a695979e8a69
        nome:
          type: string

    PostAluno:
      allOf:
        - $ref: '#/components/schemas/PostBase'
        - type: object
          properties:
            foiVisto:
              type: boolean
              example: false

    PostProfessor:
      allOf:
        - $ref: '#/components/schemas/PostBase'
        - type: object
          description: Retornado para usuários PROFESSOR ou ADMIN.
          properties:
            visualizacoes:
              type: object
              properties:
                nome:
                  type: string
                  example: Maria
                tipoUsuario:
                  type: string
                  example: ALUNO
                viewedAt:
                  type: string
                  format: date-time
                  example: '2026-07-06T12:00:00.000Z'
    Commment:
      type: object
      properties:
        parentCommentId:
          type: string
        commentId:
          type: string
        postId:
          type: string
        userId:
          type: string
        conteudo:
          type: string
        dataCriacao:
          type: string
          format: date-time
          example: '2026-07-06T10:00:00.000Z'
        dataModificacao:
          type: string
          format: date-time
          example: '2026-07-06T10:00:00.000Z'

    Usuario:
      type: object
      properties:
        id:
          type: string
        matricula:
          type: string
        nome:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
          description: Data de nascimento do usuário no formato aaaa-mm-dd.
        image:
          type: string
          nullable: true
          description: endpoint da URL da imagem do usuário.
        role:
          type: string
          example: ALUNO

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

  examples:
    ListaPostsAluno:
      summary: Resposta para aluno
      value:
        - postId: 78e6d80d-b03a-48a6-881d-a695979e8a69
          titulo: Aula 1 - TypeScript
          descricao: Introdução ao TypeScript
          conteudo: Conteúdo da aula
          image: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
          subject:
            id: 78e6d80d-b03a-48a6-881d-a695979e8a69
            nome: Matemática
          dataCriacao: '2026-07-06T10:00:00.000Z'
          dataModificacao: '2026-07-06T10:00:00.000Z'
          criadoPor:
            userId: cea50a97-f63e-4cd6-8a2c-e2a02f93c6e4
            nome: Ana Carolina
            tipoUsuario: PROFESSOR
            image: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
          foiVisto: true

    ListaPostsProfessor:
      summary: Resposta para professor e admin
      value:
        - postId: 90b6d80d-b03a-48a6-881d-a695979e8a70
          titulo: Aula 2 - Node.js
          descricao: Introdução ao Node.js
          conteudo: Conteúdo da aula
          image: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
          subject:
            id: ae853bf8-9297-4ec2-b13d-3ddbbf332f4f
            nome: Ciências
          dataCriacao: '2026-07-06T11:00:00.000Z'
          dataModificacao: '2026-07-06T11:00:00.000Z'
          criadoPor:
            userId: cea50a97-f63e-4cd6-8a2c-e2a02f93c6e4
            nome: Ana Carolina
            tipoUsuario: PROFESSOR
            image: /api/posts/90b6d80d-b03a-48a6-881d-a695979e8a70/image
          visualizacoes:
            - nome: Maria
              tipoUsuario: ALUNO
              viewedAt: '2026-07-06T12:00:00.000Z'

  responses:
    UnauthorizedError:
      description: Falha na autenticação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noToken:
              summary: Token não informado
              value:
                message: Token não informado

            InvalidToken:
              summary: Token inválido ou expirado.
              value:
                message: Token inválido ou expirado.

    ForbiddenError:
      description: O usuário autenticado não possui permissão para acessar este recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Acesso não autorizado.

    CreateUserError:
      description: Dados inválidos na requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EnrollmentAlreadyExists:
              summary: Matrícula já cadastrada
              value:
                message: Matrícula já cadastrada
            RoleNotFound:
              summary: Role não encontrada
              value:
                message: Role não encontrada
            InvalidBirthDateFormat:
              summary: Data de nascimento em formato inválido
              value:
                message: Data de nascimento deve estar no formato aaaa-mm-dd
            InvalidBirthDate:
              summary: Data de nascimento inválida
              value:
                message: Data de nascimento inválida
